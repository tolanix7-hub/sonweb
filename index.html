<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>현대차 카마스터 상담</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
<style id="pg-style">
/* Layout: light corporate page. Sticky header, navy hero, then stacked bands: service points, 4-step journey, lineup, payment calculator, purchase methods, profile + FAQ, consult desk. Staff open a drawer to edit content and read the inbox. */
:root {
  --bg: #f8f6f2;
  --card: #ffffff;
  --surface: #efebe4;
  --ink: #15171b;
  --muted: #565a61;
  --line: #dcd6cc;
  --accent: #002c5f;
  --on-accent: #ffffff;
  --link: #855437;
  --copper: #c39a7b;
  --hero: #0b0c0f;
  --hero2: #00224b;
  --kakao: #fee500;
  --on-kakao: #191600;
  --bad: #b42318; --bad-soft: #fbe2df;
  --warn: #8a5200; --warn-soft: #f8e6c6;
  --good: #1b6b44; --good-soft: #dcefe3;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --serif: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0d10; --card: #14161b; --surface: #15171c; --ink: #ece8e1; --muted: #a8a39a; --line: #2b2d34;
    --accent: #c39a7b; --on-accent: #17110c; --link: #cfa888;
    --bad: #ff8b82; --bad-soft: #3a1b19; --warn: #f0b95a; --warn-soft: #33270f; --good: #5fd39a; --good-soft: #14301f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0d10; --card: #14161b; --surface: #15171c; --ink: #ece8e1; --muted: #a8a39a; --line: #2b2d34;
  --accent: #c39a7b; --on-accent: #17110c; --link: #cfa888;
  --bad: #ff8b82; --bad-soft: #3a1b19; --warn: #f0b95a; --warn-soft: #33270f; --good: #5fd39a; --good-soft: #14301f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.65; overflow-x: hidden; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
h1, h2, h3, h4, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; letter-spacing: -.02em; }
.in { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--link); }

/* header */
.hd { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); border-bottom: 1px solid var(--line); }
.hd-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; }
.brandlink { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brandlink .org { font-size: 14px; color: var(--muted); white-space: nowrap; }
.brandlink .sep { width: 1px; height: 18px; background: var(--line); flex: none; }
.brandlink b { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dnav { display: flex; gap: 2px; }
.dnav a { text-decoration: none; padding: 10px 12px; font-size: 14.5px; font-weight: 500; color: var(--muted); min-height: 44px; display: flex; align-items: center; }
.dnav a:hover { color: var(--ink); }
.kk { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 3px; background: var(--kakao); color: var(--on-kakao); font-weight: 700; font-size: 14.5px; text-decoration: none; white-space: nowrap; flex: none; }
.kk.alt { background: var(--accent); color: var(--on-accent); }

/* hero */
.hero { position: relative; isolation: isolate; overflow: hidden; background: linear-gradient(160deg, var(--hero), var(--hero2)); color: #fff; }
.hero-bg { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; }
.hero-ov { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(9,10,13,.94) 0%, rgba(9,10,13,.84) 50%, rgba(9,10,13,.5) 100%); }
.hero::after { content: ""; position: absolute; z-index: -1; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 0 0 60px rgba(255,255,255,.03), 0 0 0 120px rgba(255,255,255,.02); }
.hero-in { padding-block: clamp(20px, 3vw, 32px) clamp(44px, 7vw, 88px); position: relative; }
.hstrip { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.2); font-size: 13.5px; color: rgba(255,255,255,.72); font-variant-numeric: tabular-nums; }
.hgrid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(28px, 6vw, 88px); padding-top: clamp(20px, 4vw, 48px); align-items: start; }
.pcard { display: flex; gap: 18px; align-items: center; }
.pcard img { width: 99px; height: 122px; object-fit: cover; object-position: center top; border-radius: 3px; border: 1px solid var(--copper); background: #fff; flex: none; display: block; }
.pcard .o { font-size: 13px; color: rgba(255,255,255,.72); }
.pcard .n { font-family: var(--serif); font-size: 24px; font-weight: 700; line-height: 1.3; }
.pcard .n span { font-family: var(--font); font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,.72); }
.pcard a { display: inline-flex; align-items: center; min-height: 32px; color: var(--copper); font-weight: 700; font-variant-numeric: tabular-nums; text-decoration: none; }
.toc p { font-size: 12.5px; font-weight: 600; letter-spacing: .2em; color: var(--copper); margin: 22px 0 4px; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc a { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; min-height: 46px; border-bottom: 1px solid rgba(255,255,255,.13); text-decoration: none; color: #fff; font-size: 15px; }
.toc a span:first-child { color: var(--copper); font-size: 13px; font-variant-numeric: tabular-nums; }
.toc a span:last-child { color: rgba(255,255,255,.5); transition: transform .2s; }
.toc a:hover span:last-child { transform: translateX(4px); color: var(--copper); }
@media (max-width: 860px) { .hgrid { grid-template-columns: 1fr; } .hero .eyebrow::before { display: none; } }
.swipe { display: none; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.hero .eyebrow { color: var(--copper); }
h1, h2, .prof .nm { font-family: var(--serif); font-weight: 700 !important; letter-spacing: -.01em; }
.hero { border-bottom: 1px solid var(--copper); }
.hero .eyebrow::before { content: ""; display: inline-block; width: 28px; height: 1px; background: var(--copper); vertical-align: middle; margin-right: 12px; }
.hd { border-bottom-color: var(--line); }
.brandlink b { font-family: var(--serif); letter-spacing: .01em; }
.tab span { opacity: .65; font-variant-numeric: tabular-nums; margin-left: 2px; }
#carmore { margin-top: 22px; }
#carmore .btn { width: 100%; background: transparent; border-color: var(--ink); }
.hero h1 { font-size: clamp(32px, 5.4vw, 62px); line-height: 1.22; margin-top: 18px; }
.hero .lede { margin-top: 22px; max-width: 34em; font-size: 17px; line-height: 1.75; color: rgba(255,255,255,.86); white-space: pre-line; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 3px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-weight: 700; font-size: 15px; text-decoration: none; transition: background .2s, border-color .2s; }
.btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.w { background: #fff; border-color: #fff; color: #0a2350; }
.btn.o { background: transparent; border-color: rgba(255,255,255,.5); color: #fff; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.hchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
.hchips li { font-size: 13px; padding: 6px 14px; border-radius: 3px; background: rgba(255,255,255,.14); }

/* bands */
.sec { padding-block: clamp(52px, 7vw, 100px); }
.sec.alt { background: var(--surface); border-block: 1px solid var(--line); }
.sh { display: flex; align-items: baseline; gap: 14px; padding-bottom: 12px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
.sh .no { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--link); font-variant-numeric: tabular-nums; }
.sh .lb { font-size: 13.5px; font-weight: 600; letter-spacing: .14em; color: var(--muted); }
.sec h2 { font-size: clamp(24px, 3.6vw, 40px); }
.sec .lead { margin-top: 10px; color: var(--muted); max-width: 60ch; white-space: pre-line; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 28px; }
.pt { border: 1px solid var(--line); border-radius: 4px; padding: 20px; background: var(--bg); }
.pt h3 { font-size: 17px; font-weight: 700; padding-top: 12px; border-top: 3px solid var(--accent); display: inline-block; }
.pt p { margin-top: 8px; color: var(--muted); font-size: 14.5px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 28px; counter-reset: s; }
.stp { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 20px; }
.stp .n { font-family: var(--serif); font-size: 34px; font-weight: 700; color: var(--link); line-height: 1.1; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.stp h3 { font-size: 18px; font-weight: 700; margin-top: 6px; }
.stp p { margin-top: 6px; color: var(--muted); font-size: 14.5px; }
.links { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 22px; }
.links a { color: var(--link); font-weight: 700; text-decoration: none; }

/* lineup */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; }
.tab { min-height: 40px; padding: 0 16px; border-radius: 3px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: 14px; font-weight: 500; }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.cars { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 18px; margin-top: 20px; }
.car { border: 1px solid var(--line); border-radius: 4px; background: var(--card); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.car .th { aspect-ratio: 16/10; background: linear-gradient(150deg, var(--hero), var(--hero2)); display: flex; align-items: center; justify-content: center; overflow: hidden; color: #fff; text-align: center; }
.car .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.car .th span { font-size: clamp(26px, 3.4vw, 34px); font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; padding: 16px; }
.car .tx { padding: 16px 18px 14px; display: grid; gap: 2px; flex: 1; align-content: start; }
.car .cat { font-size: 12px; color: var(--link); font-weight: 700; }
.car .cn { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.car .tg { color: var(--muted); font-size: 13.5px; }
.car .pr { margin-top: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.car .pr small { color: var(--muted); font-weight: 400; }
.car .ca { display: flex; gap: 8px; padding: 0 18px 18px; flex-wrap: wrap; }
.car .ca button { flex: 1 1 auto; min-height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 600; }
.car .ca button:first-child { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.small { color: var(--muted); font-size: 12.5px; margin-top: 16px; }

/* calculator */
.calc { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; margin-top: 26px; align-items: start; }
.cbox { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 20px; display: grid; gap: 14px; }
.cbox label, .fld > span { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.cbox input[type=text], .cbox select, .fm input[type=text], .fm input[type=tel], .fm select, .fm textarea {
  width: 100%; min-height: 46px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.cbox .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cbox .two > div { min-width: 0; }
.unit { position: relative; }
.unit input { padding-right: 52px !important; }
.unit em { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: 13px; pointer-events: none; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.rbox { border-radius: 4px; background: linear-gradient(160deg, var(--hero), var(--hero2)); color: #fff; padding: 22px; display: grid; gap: 16px; }
.rbox .sum { font-size: 13px; color: rgba(255,255,255,.8); }
.rbox .big { font-size: clamp(30px, 6vw, 40px); font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.rbox dl { display: grid; gap: 0; }
.rbox dl div { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.18); font-size: 14.5px; }
.rbox dd { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.cmp h4 { font-size: 13px; color: rgba(255,255,255,.8); font-weight: 500; margin-bottom: 6px; }
.cmp div { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 6px 0; font-variant-numeric: tabular-nums; }
.cmp div.on { font-weight: 700; }
.rbox .btn { width: 100%; }

.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 26px; }
.mt { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 20px; }
.mt .k { font-family: var(--serif); font-size: 34px; font-weight: 700; color: var(--link); line-height: 1.1; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.mt h3 { font-size: 18px; font-weight: 700; }
.mt p { margin-top: 6px; color: var(--muted); font-size: 14.5px; }

/* profile + faq */
.two-col { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
.prof { display: grid; gap: 22px; }
#intro .two-col { margin-top: 28px; }
.acard { border: 1px solid var(--line); border-top: 3px solid var(--accent); background: var(--card); border-radius: 4px; padding: 26px; display: grid; gap: 4px; }
.acard .o { color: var(--muted); font-size: 14px; }
.acard .nm { font-family: var(--serif); font-size: 32px; font-weight: 700; line-height: 1.3; }
.acard .nm span { font-family: var(--font); font-size: 15px; font-weight: 500; color: var(--muted); }
.acard .tl { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; text-decoration: none; margin-top: 6px; min-height: 44px; display: inline-flex; align-items: center; }
.acard .ab { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.acard .ab > * { min-height: 48px; padding-inline: 8px; }
.prof .bio { font-size: 16.5px; line-height: 1.85; }
.faq { max-width: 860px; border-top: 1px solid var(--ink); }
summary .q { font-family: var(--serif); color: var(--link); flex: none; width: 34px; }
summary span + span { flex: 1; }
.ft { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding-top: 32px; font-size: 14px; }
.ft a { color: var(--link); font-weight: 600; text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; }
.ctl { margin-top: 28px; font-size: 13.5px; color: rgba(255,255,255,.72); }
.desk .sh { border-color: rgba(255,255,255,.2); } .desk .sh .no { color: var(--copper); } .desk .sh .lb { color: rgba(255,255,255,.72); }
.desk .ct { margin-top: 10px !important; }
.dnav a.go { background: var(--accent); color: var(--on-accent); font-weight: 700; padding-inline: 16px; border-radius: 3px; margin-left: 6px; }
.dnav a.hd-tel { border-left: 1px solid var(--line); margin-left: 10px; padding-left: 16px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.dnav a { white-space: nowrap; }
.brandlink b { font-size: 20px; }
@media (max-width: 1000px) { .dnav a.hd-tel { display: none; } }
.prof .ph { border-radius: 4px; overflow: hidden; aspect-ratio: 4/5; max-width: 360px; background: linear-gradient(160deg, var(--hero), var(--hero2)); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.7); font-size: 14px; }
.prof .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prof .nm { font-size: 24px; font-weight: 800; }
.prof .or { color: var(--muted); }
.prof .bio { white-space: pre-line; }
.info { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.info div { display: flex; justify-content: space-between; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.info div:last-child { border: 0; }
.info dt { color: var(--muted); flex: none; }
.info dd { text-align: right; overflow-wrap: anywhere; min-width: 0; font-weight: 500; }
details { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 16px 4px; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-weight: 700; min-height: 56px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "＋"; color: var(--muted); font-size: 18px; flex: none; }
details[open] summary::after { content: "－"; }
details p { padding: 0 4px 16px; color: var(--muted); white-space: pre-line; }

/* consult */
.desk { background: linear-gradient(160deg, var(--hero), var(--hero2)); color: #fff; }
.desk-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(24px, 4vw, 56px); padding-block: clamp(40px, 6vw, 72px); align-items: start; }
.desk .eyebrow { color: var(--copper); }
.desk h2 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; margin-top: 8px; }
.desk .lead { margin-top: 12px; color: rgba(255,255,255,.85); }
.desk .ct { display: grid; gap: 10px; margin-top: 24px; }
.fm { background: var(--bg); color: var(--ink); border-radius: 4px; padding: 22px; }
.fm h3 { font-size: 19px; font-weight: 800; }
.fm label { display: block; margin: 14px 0 4px; font-weight: 700; font-size: 13px; }
.fm .req { color: var(--bad); }
.fm textarea { min-height: 88px; resize: vertical; }
.fm [aria-invalid="true"] { border-color: var(--bad); }
.fm .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fm .two > div { min-width: 0; }
.fm .ag { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 13px; color: var(--muted); font-weight: 400; }
.fm .ag input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.fm .btn { width: 100%; margin-top: 16px; }
.fmsg { margin-top: 12px; border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.fmsg.ok { background: var(--good-soft); color: var(--good); }
.fmsg.warn { background: var(--warn-soft); color: var(--warn); }
.fmsg.bad { background: var(--bad-soft); color: var(--bad); }
.fmsg a { color: inherit; font-weight: 700; }
.note { padding-block: 28px; font-size: 12.5px; color: var(--muted); white-space: pre-line; }

Black · 3.5 터보 48V 일렉트릭 슈퍼차저 AWD","11035"]]},{"name":"GV90","cat":"제네시스","price":"13950","tagline":"","photoId":"828a3f43c4f50ad7d3a4d6dcd918dbe2","trims":[["스탠다드 (7인승)","13950"],["인디비쥬얼 라운지 시트 (6인승)","14550"],["Neolun (시작가)","18990"]]}],"priceDate":"2026-11-01","rate":"4.9","methods":[["할부","내 명의로 바로 소유합니다. 선수금과 기간을 조절해 월 부담을 맞춥니다."],["리스","사업자 비용 처리에 유리한 경우가 많습니다. 만기 때 인수 또는 반납을 선택합니다."],["장기렌트","보험과 세금이 월 요금에 포함됩니다. 초기 비용과 관리 부담이 적습니다."],["현금 구매","이자 부담 없이 구매합니다. 진행 중인 할인 조건을 함께 확인합니다."]],"photoId":"53b4e00205127e51665699beb81f486a","bio":"신차 상담을 맡고 있습니다. 할부·리스·장기렌트·현금 중 어떤 방식이 맞는지부터 함께 정하고, 계약 전에 최신 가격표와 이달 프로모션을 확인해 조건을 나란히 보여 드립니다.","brand":"현대자동차, 제네시스","faq":[["이 페이지의 가격은 실제 계약 가격과 같나요?","참고용 가격입니다. 연식변경·옵션·프로모션에 따라 달라지므로 계약 전에 최신 가격표로 다시 안내해 드립니다."],["할부 계산기 결과대로 승인되나요?","계산기의 금리는 예시입니다. 실제 금리와 한도는 금융사 심사와 그달 프로모션에 따라 정해지며, 상담 때 조건별로 비교해 드립니다."],["전기차 보조금도 안내받을 수 있나요?","거주 지역과 차종에 따라 보조금이 다릅니다. 지역을 알려 주시면 적용 가능한 금액과 신청 일정을 확인해 드립니다."],["색상·옵션은 어떻게 정하나요?","원하시는 트림·색상·옵션을 알려 주시면 그 기준으로 견적을 맞춰 드립니다."],["출고까지 얼마나 걸리나요?","차종과 사양, 생산 일정에 따라 다릅니다. 상담 시점의 예상 출고 시기를 확인해 알려 드립니다."]],"notice":"본 페이지는 카마스터가 운영하는 개인 상담 안내 페이지이며, 현대자동차·제네시스의 공식 홈페이지가 아닙니다. 가격·할인·납기는 시점과 조건에 따라 달라질 수 있어 상담 시 최신 가격표로 안내해 드립니다. 계산기 결과는 예시이며 실제 금리와 한도는 금융사 심사에 따릅니다.","tel2":"054-452-0066"}</script>

  function loan(principal, annualPct, months, kind) {
    var P = Math.max(0, principal), n = Math.max(1, Math.round(months)), r = Math.max(0, annualPct) / 1200, out = {};
    if (kind === "pr") {
      out.first = P / n + P * r; out.last = P / n + (P / n) * r; out.interest = r * P * (n + 1) / 2; out.monthly = out.first;
    } else {
      out.monthly = r === 0 ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);

    }
    out.total = P + out.interest; out.principal = P; return out;
  }

  function subscribe() {
    if (subscribed || !db) return; subscribed = true;
    var onErr = function () { inboxErr = "접수 내역을 불러오지 못했습니다."; if ($("dr").classList.contains("on") && dtab === "inbox") drawInbox(); };
    db.collection("inquiries").onSnapshot(function (s) { inq = toMap(s); rebuild(); }, onErr);
    db.collection("triage").onSnapshot(function (s) { tri = toMap(s); rebuild(); }, onErr);
  }
  function drawInbox() {
    var dp = $("dp"); if (!dp) return;
    if (!db) { dp.innerHTML = '<div class="fmsg warn">접수 내역을 보려면 로그인한 상태로 열어야 합니다.</div>'; return; }
    var counts = { "new": 0, working: 0, done: 0 };
    items.forEach(function (x) { if (counts[x.status] !== undefined) counts[x.status]++; });
    var list = items.filter(function (x) { return filter === "all" || x.status === filter; });
    var h = '<div class="inb">' + (inboxErr ? '<div class="fmsg bad">' + esc(inboxErr) + "</div>" : "");
    h += '<div class="sumg"><div class="stat"><b>' + counts["new"] + "</b><span>신규</span></div><div class=\"stat\"><b>" + counts.working + "</b><span>상담중</span></div><div class=\"stat\"><b>" + counts.done + "</b><span>완료</span></div></div>";
    h += '<div class="flt">' + [["all", "전체 " + items.length], ["new", "신규"], ["working", "상담중"], ["done", "완료"]].map(function (f) { return '<button type="button" class="f" data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + "</button>"; }).join("") + '<span class="spc"></span><button type="button" class="b2" id="csv">CSV 내보내기</button></div><div id="inb-msg"></div>';
    if (!list.length) h += '<div class="empty">' + (items.length ? "이 상태의 접수 건이 없습니다." : "아직 접수된 상담이 없습니다. 신청이 들어오면 여기에 표시됩니다.") + "</div>";
    list.forEach(function (x) {
      h += '<article class="it" data-id="' + esc(x.id) + '"><div class="it-h"><div><span class="who">' + esc(x.name) + '</span><span class="ph2">' + esc(x.phone) + '</span></div><span class="wh">' + esc(fmtTime(x.createdAt || 0)) + "</span></div>" +
        '<div class="tags"><span class="tag s-' + esc(x.status) + '">' + esc(STATUS[x.status] || x.status) + "</span>" + [x.model, x.method && "방식 " + x.method].filter(Boolean).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
        (x.memo ? '<p class="msg">' + esc(x.memo) + "</p>" : "") +
        '<div class="it-f"><select data-st aria-label="상태 변경">' + Object.keys(STATUS).map(function (k) { return '<option value="' + k + '"' + (k === x.status ? " selected" : "") + ">" + STATUS[k] + "</option>"; }).join("") + "</select>" +
        '<input type="text" data-memo maxlength="200" placeholder="내부 메모 (고객에게 보이지 않음)" aria-label="내부 메모" value="' + esc(x.adminMemo) + '">' +
        (confirming === x.id ? '<button type="button" class="b2 danger" data-delok>삭제 확인</button><button type="button" class="b2" data-delno>취소</button>' : '<button type="button" class="b2" data-del>삭제</button>') + "</div></article>";
    });
    dp.innerHTML = h + "</div>";
  }
  function inbMsg(t) { var m = $("inb-msg"); if (m) m.innerHTML = '<div class="fmsg bad">' + esc(t) + "</div>"; }
  async function patch(id, data) {
    var cur = tri[id] || {}, it = items.filter(function (x) { return x.id === id; })[0] || {};
    var next = { status: data.status !== undefined ? data.status : (it.status || "new"), adminMemo: data.adminMemo !== undefined ? data.adminMemo : (cur.adminMemo || ""), updatedAt: Date.now() };
    try { await db.doc("triage/" + id).set(next); } catch (e) { inbMsg("변경 내용을 저장하지 못했습니다. 다시 시도해 주세요."); }
  }
  async function removeItem(id) {
    confirming = null;
    try { await db.doc("inquiries/" + id).delete(); await db.doc("triage/" + id).delete(); } catch (e) { drawInbox(); inbMsg("삭제하지 못했습니다. 다시 시도해 주세요."); }
  }
  async function exportCsv() {
    var dl = null;
    try { dl = window.claude ? await window.claude.use("downloads") : null; } catch (e) {}
    if (!dl) { inbMsg("이 화면에서는 파일 저장을 사용할 수 없습니다."); return; }
    var e2 = function (v) { v = String(v == null ? "" : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var head = ["접수일시", "성함", "연락처", "관심차종", "구매방식", "궁금한점", "상태", "내부메모"];
    var rows = items.map(function (x) { return [fmtTime(x.createdAt || 0), x.name, x.phone, x.model, x.method, x.memo, STATUS[x.status] || x.status, x.adminMemo].map(e2).join(","); });
    var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    try { await dl.save({ filename: "상담접수_" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ".csv", data: "﻿" + [head.map(e2).join(",")].concat(rows).join("\r\n") }); }
    catch (e) { if (!e || e.code !== "declined") inbMsg("파일을 저장하지 못했습니다."); }
  }

  /* ---- Events ---- */
  document.addEventListener("click", function (e) {
    var t = e.target, q = function (s) { return t.closest ? t.closest(s) : null; }, x;
    if (t.id === "q-go") { submit(); return; }
    if (q("#adm")) { openDrawer(); return; }
    if (t.id === "dx" || t === $("dr")) { closeDrawer(); return; }
    if ((x = q("#car-more"))) { showAll = true; drawCars(); return; }
    if ((x = q("[data-cat]"))) { cat = x.getAttribute("data-cat"); var ts = document.querySelectorAll(".tab"); for (var i = 0; i < ts.length; i++) ts[i].setAttribute("aria-pressed", String(ts[i] === x)); drawCars(); return; }
    if ((x = q("[data-calc]"))) { var n = +x.getAttribute("data-calc"); pickCar(n); drawCalc(); $("calc").scrollIntoView(); return; }
    if ((x = q("[data-ask]"))) { goConsult(+x.getAttribute("data-ask")); return; }
    if (t.id === "k-ask") { var s = calcState(), r = s.res; goConsult(calc.car, "[계산 조건] " + (calc.car >= 0 ? calcName() + " · " : "") + "차량가격 " + manwon(calc.price) + " · 선수금 " + calc.down + "% · " + calc.term + "개월 · 연 " + s.rate + "% · " + (calc.kind === "pr" ? "원금균등" : "원리금균등") + " → " + (calc.kind === "pr" ? "첫 달 " : "월 ") + "약 " + won(r.monthly)); return; }
    if ((x = q("[data-dt]"))) { dtab = x.getAttribute("data-dt"); drawDrawer(); return; }
    if (t.id === "save") { savePublish(); return; }
    if (t.id === "discard") { C = JSON.parse(SAVED); delCar = -1; render(); drawEdit(); return; }
    if ((x = q("[data-phrm]"))) { C[x.getAttribute("data-phrm")] = ""; render(); drawEdit(); return; }
    if (t.id === "car-add") { C.cars.push({ name: "", cat: catList()[0] || "", price: "", tagline: "", photoId: "" }); render(); drawEdit(); return; }
    if ((x = q("[data-cdel]"))) { delCar = +x.getAttribute("data-cdel"); drawEdit(); return; }
    if (q("[data-cdno]")) { delCar = -1; drawEdit(); return; }
    if ((x = q("[data-cdok]"))) { C.cars.splice(+x.getAttribute("data-cdok"), 1); delCar = -1; calc.car = -1; render(); drawEdit(); return; }
    if ((x = q("[data-cup]"))) { var k = +x.getAttribute("data-cup"); if (k > 0) { var tmp = C.cars[k]; C.cars[k] = C.cars[k - 1]; C.cars[k - 1] = tmp; calc.car = -1; render(); drawEdit(); } return; }
    if ((x = q("[data-cprm]"))) { C.cars[+x.getAttribute("data-cprm")].photoId = ""; render(); drawEdit(); return; }
    if ((x = q("[data-f]"))) { filter = x.getAttribute("data-f"); drawInbox(); return; }
    if (t.id === "csv") { exportCsv(); return; }
    var card = q(".it"); if (!card) return;
    var id = card.getAttribute("data-id");
    if (t.hasAttribute("data-del")) { confirming = id; drawInbox(); }
    else if (t.hasAttribute("data-delno")) { confirming = null; drawInbox(); }
    else if (t.hasAttribute("data-delok")) removeItem(id);
  });
  document.addEventListener("change", function (e) {
    var t = e.target, ph = t.getAttribute && t.getAttribute("data-ph"), ci = t.getAttribute && t.getAttribute("data-cph");
    if (t.id === "car-bulk") { onBulk([].slice.call(t.files)); t.value = ""; return; }
    if (t.id === "e-bulk") { onBulk([].slice.call(t.files)); t.value = ""; return; }
    if (ph) { onUpload(t.files[0], function (id) { C[ph] = id; }, ph === "heroPhotoId" ? 1800 : 1000); t.value = ""; return; }
    if (ci) { var n = +ci; onUpload(t.files[0], function (id) { C.cars[n].photoId = id; }, 1200); t.value = ""; return; }
    if (t.id === "k-car") { if (+t.value >= 0) pickCar(+t.value); else calc.car = -1; drawCalc(); return; }
    if (t.id === "k-trim") { calc.trim = +t.value; var tr = carTrims(calc.car)[calc.trim]; if (tr) calc.price = num(tr[1]); drawCalc(); return; }
    if (t.id === "k-down") { calc.down = +t.value; updateCalc(); return; }
    if (t.id === "k-term") { calc.term = +t.value; updateCalc(); return; }
    if (t.id === "k-kind") { calc.kind = t.value; updateCalc(); return; }
    var card = t.closest && t.closest(".it"); if (!card) return;
    var id2 = card.getAttribute("data-id");
    if (t.hasAttribute("data-st")) patch(id2, { status: t.value });
    else if (t.hasAttribute("data-memo")) patch(id2, { adminMemo: t.value.trim() });
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "q-p") {
      var d = t.value.replace(/\D/g, "").slice(0, 11), out = d;
      if (d.length > 7) out = d.slice(0, 3) + "-" + d.slice(3, d.length - 4) + "-" + d.slice(-4);
      else if (d.length > 3) out = d.slice(0, 3) + "-" + d.slice(3);
      t.value = out; return;
    }
    if (t.id === "k-price") { calc.price = num(t.value); updateCalc(); return; }
    if (t.id === "k-rate") { calc.rate = num(t.value); updateCalc(); return; }
    if (!(t.closest && t.closest(".ed"))) return;
    var k = t.getAttribute("data-k"), cf = t.getAttribute("data-cf");
    if (k) { C[k] = t.hasAttribute("data-lines") ? fromLines(t.value) : t.value; if (k === "rate") calc.rate = null; render(); updateDirty(); }
    else if (t.hasAttribute("data-ctr")) { var ti = +t.getAttribute("data-ci"); C.cars[ti].trims = fromLines(t.value); render(); updateDirty(); }
    else if (cf) { var ci = +t.getAttribute("data-ci"); C.cars[ci][cf] = t.value; if (cf === "name") { var b = t.closest(".cb").querySelector(".hd2 b"); if (b) b.textContent = t.value || "새 차종"; } render(); updateDirty(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

  /* ---- Boot ---- */
  async function boot() {
    render();
    var cl = window.claude, user = null;
    try { db = cl ? await cl.use("db") : null; } catch (e) { db = null; }
    try { user = cl ? await cl.use("user") : null; } catch (e) {}
    try { isAdmin = !!(user && await user.canEdit()); } catch (e) { isAdmin = false; }
    try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
    var canWrite = null;
    try { if (user) canWrite = await user.can("data.write"); } catch (e) {}
    mode = (db && uid && canWrite !== false) ? "db" : "copy";
    if (isAdmin) {
      try { arApi = cl ? await cl.use("artifact") : null; } catch (e) { arApi = null; }
      try { assetsApi = cl ? await cl.use("assets") : null; } catch (e) { assetsApi = null; }
    }
    if (db && uid && !isAdmin) { try { var prev = await db.doc("inquiries/" + uid).get(); if (prev.exists) hasPrev = true; } catch (e) {} }
    applyMode();
    if (db && isAdmin) subscribe();
  }
  boot();
})();
</script>

</body>
</html>
